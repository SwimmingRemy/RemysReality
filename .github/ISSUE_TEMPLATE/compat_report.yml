name: Compatibility report (after a game, RLS or BeamNG.Earth update)
description: Something that worked before an update stopped working after it.
title: "[compat] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: >-
        Remy's Reality sits on top of two mods that both move quickly, so this is the
        quickest way to tell me an update broke it. Please say what each version was
        **before** and **after** — knowing which one moved is most of the diagnosis.
  - type: input
    id: what-updated
    attributes:
      label: What did you update?
      placeholder: "BeamNG.Earth dev.450 to dev.452"
    validations:
      required: true
  - type: input
    id: rr-version
    attributes:
      label: Remy's Reality version
      placeholder: "0.7.39"
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: BeamNG.drive version
      placeholder: "0.40.5"
    validations:
      required: true
  - type: input
    id: rls-version
    attributes:
      label: RLS Career Overhaul version
      placeholder: "2.8.0.1"
    validations:
      required: true
  - type: input
    id: earth-version
    attributes:
      label: BeamNG.Earth version
      placeholder: "1.9.1-beta.dev.452"
    validations:
      required: true
  - type: textarea
    id: before-after
    attributes:
      label: What worked before, and what happens now?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        Attach beamng.log if you can, and /settings/srcl_earthcareer_diag.json. The log
        goes quiet a short way into a session, so a missing line does not prove anything —
        say what you saw on screen too.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I did not unzip the mod
        - label: I deleted any older Remy's Reality zip from my mods folder
        - label: BeamNG.Earth's companion server was running
